{% extends "base.html" %}

{% block main_content %}
    {% if page?.extra?.typst | default(value=false) %}
        {{<typst page={page} config={config}/>}}
    {% else %}
        {{<content page={page} config={config}/>}}
    {% endif %}
    
{% endblock main_content %}

{% block comments %}
    {% if config.extra.comment | default(value=false) %}
    <div class="giscus"></div>
    {% include "_giscus_script.html" %}
    {% endif %}
{% endblock %}
