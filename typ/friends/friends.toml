# Friends of this blog.
#
# Each entry:
#   name        - display name (required)
#   url         - link to their site (required)
#   avatar      - avatar image URL, downloaded at build time (optional)
#   description - short intro (required)
#
# If `avatar` is missing (or the URL is unreachable at build time),
# a placeholder with the first letter of the name is rendered instead.

[[friend]]
