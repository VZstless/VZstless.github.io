name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v5

      # `yarn build:typ` downloads LXGW WenKai Screen (26 MiB) into `fonts/` for
      # Typst and mirrors the subsetted webfont into `static/webfonts/` (deployed
      # with the site, so every page uses it). Both are gitignored, so cache
      # them to make repeat builds skip the downloads.
      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: |
            fonts
            static/webfonts/lxgw-wenkai
          key: fonts-lxgw-wenkai-screen-v1.530-webfont-1.7.0

      - name: Install typst-ts-cli
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: typst-ts-cli
          git: https://github.com/Myriad-Dreamin/typst.ts
          tag: v0.6.0
          locked: true

      - name: Install CJK fonts for Typst
        # Fallback fonts only: the blog's own font is fetched by `yarn build:typ`.
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'yarn'

      - name: Build frontend
        shell: bash
        run: |
          yarn install
          yarn build:fe
          yarn build:typ

      - name: Deploy with Zola
        uses: shalzz/zola-deploy-action@v0.23.3
        env:
          PAGES_BRANCH: static
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
