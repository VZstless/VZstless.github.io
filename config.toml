title = "VZstless"

# The URL the site will be built for
base_url = "https://vzstless.moe"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

theme = "apollo"

taxonomies = [{ name = "tags", feed = true }]

[extra]
comment = true
favicon = "favicon.ico"
use_cdn = true
menu = [
  { name = "/posts", url = "/posts", weight = 1 },
  { name = "/tags", url = "/tags", weight = 2 },
  { name = "/dn42", url = "/dn42", weight = 3 },
  { name = "/friends", url = "/friends", weight = 4 },
  { name = "/search", url = "/search", weight = 5 },
]
mathjax = true
mathjax_dollar_inline_enable = true

socials = [
  { name = "twitter", url = "https://vzstless.moe", icon = "twitter" },
  { name = "github", url = "https://github.com/VZstless", icon = "github" },
  { name = "rss", url = "/posts/atom.xml", icon = "rss" },
]

insert_anchor_links = "heading"

dynamic_note = true

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"
